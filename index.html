<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app is dark-only (see `src/styles.css`). Declared here as well as
         in CSS so the very first paint — before the stylesheet loads — is
         already dark, rather than flashing white on launch. -->
    <meta name="color-scheme" content="dark" />
    <title>CourseCut</title>

    <!-- The packaged app's icon comes from `src-tauri/icons/`, and a Tauri
         window has no tab to put a favicon in — these are for `npm run dev`,
         which is opened in a real browser. Same artwork either way:
         `coursecut.png` at the repo root. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
